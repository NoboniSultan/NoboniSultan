<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Noboni Sultan">
  <defs>
    <linearGradient id="flow-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#60A5FA;#22D3EE;#F472B6;#A78BFA" dur="8s" begin="0s" repeatCount="indefinite" />
      </stop>
      <stop offset="33%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#A78BFA;#60A5FA;#22D3EE;#F472B6;#A78BFA" dur="8s" begin="-2s" repeatCount="indefinite" />
      </stop>
      <stop offset="66%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#A78BFA;#60A5FA;#22D3EE;#F472B6;#A78BFA" dur="8s" begin="-4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#F472B6">
        <animate attributeName="stop-color" values="#A78BFA;#60A5FA;#22D3EE;#F472B6;#A78BFA" dur="8s" begin="-6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <text x="50%" y="52%" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', Verdana, sans-serif" font-size="60" font-weight="700" letter-spacing="2" fill="url(#flow-dark)">Noboni Sultan</text>
</svg>
